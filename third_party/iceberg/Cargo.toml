# above. `macros` for the `#[tokio::test]` and `#[tokio::main]` attributes,
# `rt-multi-thread` because `#[tokio::main]` defaults to that flavour -- the
# five `writer` and crate-root doctests need it, and without this entry they
# only build inside a workspace that turns the feature on for something else.
[dev-dependencies.tokio]

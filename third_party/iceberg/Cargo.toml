# siglake: `rt` for `tokio::task::coop::consume_budget` on the object-cache hit
# path in `io/file_io.rs` (and for the `runtime` module's `spawn`); `time` for
# `tokio::time::timeout` on the reversed-chunk in-flight wait in
# `arrow/reader.rs` and for the `tokio::time::sleep` handed to backon in
# `transaction/mod.rs`. Upstream asks for `sync` alone and the rest arrive
# through feature unification (reqwest turns on `time`, parquet `macros`), so
# these lines are what keeps the fork buildable on its own.

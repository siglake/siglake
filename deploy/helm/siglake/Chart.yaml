apiVersion: v2
name: siglake
description: |
  siglake — an OTLP-native log analytics platform in Rust, built on
  Parquet v2 + Apache Iceberg + DataFusion. One chart deploys the three
  data-plane pods (ingester, compactor, query-server); per-service
  `enabled` toggles let customers turn off components they don't need.
type: application
version: 0.1.1
appVersion: "0.1.1"
kubeVersion: ">=1.27.0-0"
home: https://github.com/siglake/siglake
sources:
  - https://github.com/siglake/siglake
maintainers:
  - name: limnion-ai
    url: https://github.com/limnion-ai
keywords:
  - logs
  - observability
  - iceberg
  - parquet
annotations:
  category: Analytics

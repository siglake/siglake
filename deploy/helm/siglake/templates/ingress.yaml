{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "siglake.fullname" . }}
  labels:
    {{- include "siglake.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- /* "service" is the component role (query, ingester) */}}
                {{- $svc := default "query" .service }}
                name: {{ include "siglake.componentName" (list $ $svc) }}
                port:
                  name: {{ if eq $svc "ingester" }}ingest{{ else }}http{{ end }}
          {{- end }}
    {{- end }}
{{- end }}

{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.queryTokens.remoteKey -}}
{{- $secretName := .Values.query.tokens.existingSecret -}}
{{- if not $secretName -}}
{{- $secretName = include "siglake.componentName" (list . "query-tokens") -}}
{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "siglake.componentLabels" (list . "query") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.query.tokens.secretKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecrets.queryTokens.remoteKey | quote }}
{{- end }}

{{- if .Values.metricsService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "siglake-operator.fullname" . }}
  labels:
    {{- include "siglake-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "siglake-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metricsService.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}

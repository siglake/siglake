apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "siglake-operator.fullname" . }}
  labels:
    {{- include "siglake-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "siglake-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "siglake-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "siglake-operator.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "siglake-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --prometheus-url
            - {{ .Values.prometheus.url | quote }}
            {{- with .Values.watchNamespaces }}
            {{- range . }}
            - --watch-namespace
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.metricsService.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsService.port }}
              protocol: TCP
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

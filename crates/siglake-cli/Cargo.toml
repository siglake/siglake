[package]
name = "siglake-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Siglake CLI: smoke-test ingest and query for the Siglake storage layer."

[[bin]]
name = "siglake"
path = "src/main.rs"

[features]
# Passthrough for a profiling build (`deploy/Dockerfile` with `PROFILING=1`).
# Two halves, and BOTH have to be here rather than in siglake-core: the routes
# come from siglake-core, but `--enable-prof` is a property of the jemalloc that
# *this* crate's `#[global_allocator]` links, so siglake-core cannot turn it on.
# Without the second half the heap route answers 412.
profiling = ["siglake-core/profiling", "tikv-jemallocator/profiling"]

[dependencies]
reqwest = { workspace = true }
rustyline = { workspace = true }
siglake-core = { workspace = true }
siglake-storage = { workspace = true }
siglake-wal = { workspace = true }
siglake-ingest = { workspace = true }
siglake-compactor = { workspace = true }

anyhow = { workspace = true }
metrics = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true }
iceberg = { workspace = true }
object_store = { workspace = true }
opendal = { workspace = true }
reqsign-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tikv-jemallocator = "0.7.0"

[dev-dependencies]
arrow-array = { workspace = true }
axum = { workspace = true }
libc = "0.2"
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true

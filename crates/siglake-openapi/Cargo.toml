[package]
name = "siglake-openapi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Emit the committed OpenAPI 3.1 specs for the Siglake HTTP servers."

[[bin]]
name = "siglake-openapi"
path = "src/main.rs"

[dependencies]
siglake-ingest = { workspace = true }
siglake-query-server = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
utoipa = { workspace = true }
# Keep the generator on kube-client's maintained YAML stack without enabling
# utoipa's separate `serde_norway`-based `yaml` feature.
serde-saphyr = "0.0.29"

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

openapi: 3.1.0
info:
  title: siglake ingest
  description: |-
    OTLP/HTTP logs and traces, plus an Elasticsearch 7.10-shaped bulk-ingest surface for existing shippers.

    Query lives on a separate server (`siglake-query-server`, `openapi-query.yaml`) — this one only accepts writes.
  license:
    name: Apache-2.0
  version: 0.2.1
servers:
- url: http://localhost:8088
  description: Default `--bind` address
paths:
  /:
    get:
      tags:
      - elasticsearch-compat
      summary: Elasticsearch version fingerprint.
      description: |-
        Exists because several ES-compatible shippers probe `GET /` on startup and
        refuse to send anywhere that does not identify as Elasticsearch.
      operationId: get_es_root
      responses:
        '200':
          description: Version fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsRootInfo'
        '400':
          description: Invalid `X-Scope-OrgID` value. The ingest middleware validates the header on every route before the handler runs, so this route refuses a malformed tenant id even though it ignores which tenant is named. Body is the siglake `{text, code}` envelope, not an ES-shaped body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '403':
          description: Tenant refused by the ingest middleware before the handler runs — a tenant header this single-tenant ingester will not route, a header that disagrees with (or a token that lacks) the JWT tenant claim, a resolved tenant outside `--allowed-tenants`, or a novel tenant past `--max-tenants` — even though this route ignores which tenant is named. Body is the siglake `{text, code}` envelope, not an ES-shaped body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '429':
          description: Rate limited.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitBody'
    head:
      tags:
      - elasticsearch-compat
      summary: Reachability probe used by ES clients that `HEAD /` before sending.
      description: |-
        NO RESPONSE BODIES ARE DECLARED HERE, on any status. A `HEAD` response never
        carries content, so a declared schema would describe something the client
        cannot read; the previous `401`, and the `400`/`403` added with the tenant
        refusals, described "what `GET /` would return" instead, which reads as a
        promise of a body that will not arrive. Decided once, 2026-09-06, in favour
        of declaring status and headers only: `GET /` documents the envelopes, and
        this route's refusals are byte-identical to it apart from the stripped body.
        Headers stay declared — `retry-after` is exactly the thing a `HEAD` caller
        still receives and must obey.
      operationId: head_es_root
      responses:
        '200':
          description: Reachable. Empty body.
        '400':
          description: 'Invalid `X-Scope-OrgID` value. The ingest middleware validates the header on every route before the handler runs, so this route refuses a malformed tenant id even though it ignores which tenant is named. No body: see `GET /` for the envelope the same refusal carries there.'
        '401':
          description: Missing or invalid credentials. No body.
        '403':
          description: Tenant refused by the ingest middleware before the handler runs — a tenant header this single-tenant ingester will not route, a header that disagrees with (or a token that lacks) the JWT tenant claim, a resolved tenant outside `--allowed-tenants`, or a novel tenant past `--max-tenants` — even though this route ignores which tenant is named. No body.
        '429':
          description: Rate limited. `ingest_rate_limit_middleware` wraps every ingest route and runs ahead of even the auth check, so this probe is throttled like any other request. No body — `retry-after` carries the only part a `HEAD` caller could have read anyway.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
  /_cluster/health:
    get:
      tags:
      - elasticsearch-compat
      summary: Cluster health, always `green`.
      description: |-
        siglake has no ES-style shard allocation to report on; shippers use this
        purely as a readiness gate before starting to send.
      operationId: get_es_cluster_health
      responses:
        '200':
          description: Always `green`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsClusterHealth'
        '400':
          description: Invalid `X-Scope-OrgID` value. The ingest middleware validates the header on every route before the handler runs, so this readiness gate refuses a malformed tenant id even though it ignores which tenant is named. Body is the siglake `{text, code}` envelope, not an ES-shaped body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '403':
          description: Tenant refused by the ingest middleware before the handler runs — a tenant header this single-tenant ingester will not route, a header that disagrees with (or a token that lacks) the JWT tenant claim, a resolved tenant outside `--allowed-tenants`, or a novel tenant past `--max-tenants` — even though this route ignores which tenant is named. Body is the siglake `{text, code}` envelope, not an ES-shaped body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '429':
          description: Rate limited. `ingest_rate_limit_middleware` wraps every ingest route, this readiness gate included, and runs ahead of even the auth check — so a shipper that polls health hard enough is throttled here, before it has sent a single event.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitBody'
  /api/v1/_elastic/_bulk:
    post:
      tags:
      - elasticsearch-compat
      summary: Elasticsearch `_bulk` ingest.
      description: |-
        The body is ES bulk NDJSON: an action line, optionally followed by a source
        line. `Content-Type` is not inspected. Supported actions are `index` and
        `create`; `update` and `delete` parse but are rejected per-item
        (`unsupported_operation_exception`) because siglake is append-only. An
        unrecognized action fails the whole request with `400`.

        Document mapping: `@timestamp` → `timestamp`, `host.name`/`host` → `host`,
        `service.name` → `source`, `sourcetype` → `sourcetype`, `message` → `raw`,
        and every residual field is preserved in the `attributes` JSON column.

        **Partial failures return HTTP 200** with `errors: true` — inspect `items`,
        not just the status code.
      operationId: post_es_bulk
      parameters:
      - name: commit
        in: query
        description: |-
          Durability the caller wants before the response returns. Overrides the
          `x-siglake-commit` header when both are present. Defaults to `wait_for`.

          An unrecognized value is rejected by axum's `Query` extractor with a
          bare `400`, not the usual error envelope.
        required: false
        schema:
          type: string
          enum:
          - auto
          - wait_for
          - force
      - name: x-siglake-commit
        in: header
        description: 'Durability mode: `auto` | `wait_for` | `force`. Defaults to `wait_for`; overridden by the `commit` query parameter.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: x-scope-orgid
        in: header
        description: 'Tenant id, `[A-Za-z0-9_-]{1,128}`. Absent ⇒ `default`: the request is accepted and written into the `default` tenant rather than rejected. WHETHER IT ROUTES ANYWHERE IS A DEPLOYMENT SETTING. A single-tenant ingester — the default — accepts this header only when it names `default`, and answers `403` otherwise; it does not silently write elsewhere. `--trust-scope-header` makes the header select the tenant. When the ingester derives the tenant from a verified JWT claim (`--oidc-tenant-claim`) the claim is the authority and this header may only AGREE with it; disagreeing is `403`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        description: 'ES bulk NDJSON: action line, optional source line, repeated.'
        content:
          application/x-ndjson:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Request parsed. Individual items may still have failed — check `errors` and `items`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsBulkResponse'
        '400':
          description: Malformed NDJSON, or an unsupported action, which fails the whole request. An invalid `X-Scope-OrgID` value is also a `400`, but comes from the ingest middleware ahead of the handler and carries the siglake `{text, code}` envelope instead of this one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '403':
          description: 'Tenant refused: this ingester is single-tenant and the header named another tenant, or the header disagrees with (or the token lacks) the JWT tenant claim, or the resolved tenant is outside `--allowed-tenants`, or this ingester is at `--max-tenants` and the resolved tenant is one it has not admitted before.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '413':
          description: Body exceeds the ingest body cap (env-tunable, 16 MiB by default).
        '429':
          description: Rate limited.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '503':
          description: Transient load shedding, or a novel tenant/index key past the persistent lane cap. The lane-cap response has no Retry-After header because recovery requires routing or operator action.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying; absent for a lane-cap refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
        '504':
          description: '`commit=force` did not complete in time.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiglakeErrorBody'
  /api/v1/_elastic/_cluster/health:

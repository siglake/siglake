            unbounded.
    PhaseStats:
      type: object
      description: |-
        Per-query wall-clock attribution, all in microseconds. The single-pod path
        fills the local phases; a coordinated query fills `distributed` instead of
        `collect_micros` (its work happens on the workers).
      required:
      - plan_micros
      - buffer_delta_micros
      - collect_micros

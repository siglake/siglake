  /api/v1/jobs/{id}:
    get:
      tags:
      - jobs
      summary: Poll a batch job's status.
      description: |-
        Batch jobs are created by `POST /api/v1/sql` with `priority: "batch"`.
        Any replica answers for any job: the store is the catalog database by
        default (`query.jobs.persistent`), so the id is not tied to the pod that
        took the submission. With that turned off each pod keeps its own in-memory
        jobs and a poll routed elsewhere answers `404`.
      operationId: status
      parameters:
      - name: id
        in: path
        description: Job id (UUIDv7).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job state. `cost` is populated once planning has run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfo'
        '400':
          description: Malformed job id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          description: The job store is temporarily unavailable; retry the request.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
    delete:
      tags:
      - jobs
      summary: Cancel a batch job.
      description: |-
        The `202` means the cancellation is *persisted* and terminal: the job row
        reads `cancelled` from every replica, and a completion the executor writes
        afterwards is refused. Pending or running execution is then aborted,
        releasing its query-admission reservation and cancelling its storage scans.

        When the executing replica is this one, that abort is immediate. When it is
        another replica — the ordinary case, since the store is shared by default
        and the chart runs two query pods — the abort handle lives in that process,
        and it observes the persisted cancellation within `--jobs-cancel-poll-secs`
        (default 2 s).
        So `202` bounds when the work stops rather than promising it has already
        stopped. A job that already reached a terminal state answers `409`.
      operationId: cancel
      parameters:
      - name: id
        in: path
        description: Job id (UUIDv7).
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Cancellation persisted. The row is `cancelled` for every replica and a later completion is refused; the executing replica aborts the work within `--jobs-cancel-poll-secs` (default 2 s) when it is not the replica that served this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCancelResponse'
        '400':
          description: Malformed job id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: The job already reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          description: The job store is temporarily unavailable; retry the request.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'

openapi: 3.1.0
info:
  title: siglake query
  description: |-
    DataFusion SQL over the Iceberg tables, index and index-template management, batch jobs, GDPR delete tasks, and a Jaeger-compatible trace read API.

    Ingest lives on a separate server (`openapi-ingest.yaml`) — this one only reads, apart from index management and delete tasks.
  license:
    name: Apache-2.0
  version: 0.2.0
servers:
- url: http://localhost:8089
  description: Default `--bind` address
paths:
  /api/v1/delete-tasks:
    get:
      tags:
      - delete-tasks
      summary: List delete tasks and their progress.
      operationId: list
      parameters:
      - name: index_id
        in: query
        description: Return only tasks for this index. Omit to list every index's tasks.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Matching delete tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeleteTask'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
    post:
      tags:
      - delete-tasks
      summary: Submit a delete task (GDPR / targeted deletion).
      description: |-
        Asynchronous: this records the request and returns immediately with the task
        in `pending`. A background executor rewrites the affected data files without
        their matching rows. Rows removed from the live snapshot stay visible to
        snapshot time-travel until a later snapshot-expiry plus orphan-GC sweep drops
        the old files, so completion here is not the same as unrecoverable erasure.

        THE TASK BELONGS TO ONE INDEX INCARNATION. The record carries the
        `table_uuid` this server resolved `index_id` to at submission. An index id
        is reusable — deleting an index and creating it again under the same id
        gives a different table — and the executor refuses a task whose `index_id`
        no longer resolves to that table, so a deletion queued against the dropped
        index never touches the replacement's rows. The refusal is a `failed` task
        whose `error` names both tables; recover it the same way as any other
        failure, by resubmitting against the index that exists. Tasks recorded
        before this binding existed carry a null `table_uuid` and are refused for
        the same reason: nothing infers an incarnation from the reused name.

        RECOVERING A `failed` TASK. The lifecycle is one-way: the executor takes
        `pending` tasks only, and no surface returns a terminal task to `pending`.
        A task that reached `failed` therefore never runs again, even though the
        deletion request was acknowledged with a 201 — and neither does one left in
        `running` by a crash or by a status write that failed after its rewrite
        committed. The recovery is the same for both: remedy the failure cause —
        named in the task's `error`, where it has one — make sure the executor runs
        the fixed build, and then POST the original `index_id`, `predicate_sql`,
        `start_ts` and `end_ts` here again under the same tenant identity — request
        fields only. The response carries a NEW `task_id` in `pending`; the failed
        record and its `error` are left exactly as they were, so record both ids in
        your audit trail. Then confirm delete-task execution was not turned off for
        this deployment — the compactor's maintenance sweep runs it by default,
        `SIGLAKE_DELETE_TASKS=0` disables it — and poll
        `GET /api/v1/delete-tasks/{id}` on the new id until it is `done` or
        `failed`.

        This is a resubmission, not a retry: it is not idempotent at the HTTP layer
        (every POST creates another task) and it promises nothing about
        exactly-once execution. Each task reports only what its own run rewrote,
        never the request's cumulative effect. Over an unchanged dataset with the
        same predicate and the same fixed bounds a repeat finishes with
        `rows_deleted: 0`, `files_rewritten: 0` and no new snapshot — but a
        predicate that is time-dependent, or new rows that have arrived since,
        makes the repeat delete a different set.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeleteTaskRequest'
        required: true
      responses:
        '201':
          description: Task recorded in `pending`, bound to the index incarnation named in `table_uuid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTask'
        '400':
          description: Empty or unparseable `predicate_sql`, or `start_ts >= end_ts`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/delete-tasks/{id}:
    get:
      tags:
      - delete-tasks
      summary: Fetch one delete task, including rows deleted and files rewritten.
      operationId: get
      parameters:
      - name: id
        in: path
        description: Task id.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The delete task. Pending tasks include a read-only claim observation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTaskGetResponse'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/index-templates:
    get:
      tags:
      - index-templates
      summary: List every index template in the caller's tenant namespace.
      description: |-
        Templates apply a document mapping to indexes created later whose id matches
        one of their glob patterns; the highest `priority` match wins. Templates are
        never shared across tenant namespaces.
      operationId: list_templates
      responses:
        '200':
          description: All index templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexTemplate'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/index-templates/{id}:
    put:
      tags:
      - index-templates
      summary: Create or replace an index template.
      description: |-
        Upsert: there is no separate `POST`. The body's `template_id` must equal the
        path id. Templates are applied at index-creation time, so editing one does
        not retroactively change existing indexes. The template is stored only in
        the caller's tenant namespace.
      operationId: put_template
      parameters:
      - name: id
        in: path
        description: Template id. Must match the body's `template_id`.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexTemplate'
        required: true
      responses:
        '200':
          description: Stored. Body echoes the template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTemplate'
        '400':
          description: Invalid template, or the path id does not match the body's `template_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
    delete:
      tags:
      - index-templates
      summary: Delete an index template from the caller's tenant namespace.
      operationId: delete_template
      parameters:
      - name: id
        in: path
        description: Template id.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted. Empty body.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/indexes:
    get:
      tags:
      - indexes
      summary: List every index in the caller's tenant.
      operationId: list
      responses:
        '200':
          description: All index configurations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexConfig'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
    post:
      tags:
      - indexes
      summary: Create an index.
      description: |-
        The body is the full index configuration: its document mapping (typed
        columns and their tokenizers), the required timestamp field, and optional
        retention. Attributes not declared here are handled per `doc_mapping.mode`.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexConfig'
        required: true
      responses:
        '201':
          description: Created. Body is the stored configuration as the catalog normalized it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexConfig'
        '400':
          description: Invalid configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '409':
          description: An index with this id already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/indexes/{id}:
    get:
      tags:
      - indexes
      summary: Fetch one index configuration.
      operationId: get
      parameters:
      - name: id
        in: path
        description: Index id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The index configuration.
          headers:
            ETag:
              schema:
                type: string
              description: Strong validator for this table incarnation's full index configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexConfig'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
    put:
      tags:
      - indexes
      summary: Replace an index configuration.
      description: |-
        Schema changes are additive only — the catalog rejects an update that would
        drop or retype an existing column. The body's `index_id` must equal the path
        id.
      operationId: update
      parameters:
      - name: id
        in: path
        description: Index id. Must match the body's `index_id`.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: Optional RFC 9110 strong entity-tag condition. `*` matches any existing index.
        required: false
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexConfig'
        required: true
      responses:
        '200':
          description: Updated. Body is the stored configuration.
          headers:
            ETag:
              schema:
                type: string
              description: Strong validator for the returned configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexConfig'
        '400':
          description: Invalid configuration, or the path id does not match the body's `index_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '412':
          description: The supplied If-Match condition is false. `current` and ETag come from the exact rejecting commit base; another writer may replace them before this response arrives.
          headers:
            ETag:
              schema:
                type: string
              description: Strong validator matching `current`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedIndexPreconditionErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
    delete:
      tags:
      - indexes
      summary: Delete an index.
      description: |-
        Removes the catalog entry only. Committed data files remain at the table
        location; the current retention and orphan-GC sweeps cannot reclaim them
        after the catalog entry is gone.
      operationId: delete
      parameters:
      - name: id
        in: path
        description: Index id.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted. Empty body.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/jaeger/{index}/api/services:
    get:
      tags:
      - jaeger
      summary: Jaeger-compatible service-name list.
      description: |-
        Part of a read API shaped so the Jaeger UI can be pointed at siglake
        unchanged. Backed by the same stored spans SQL sees.
      operationId: services
      parameters:
      - name: index
        in: path
        description: Index holding the spans.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Distinct service names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JaegerNamesResponse'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '413':
          description: 'The render exceeded one of this request''s ceilings. Two units apply: distinct names and accumulated Arrow bytes (a span can carry megabytes of attributes, so no row count bounds the render). Both are DERIVED from the admission reservation this request already holds — `min(16 MiB, budget / share)` — so they move with `SIGLAKE_QUERY_ADMISSION_BUDGET_BYTES` and the pod''s memory and there is no Jaeger-specific knob; the resolved interactive `max_rows_returned` still applies where it is tighter. Counted across the WHOLE request: for a trace search, the spans of every selected trace rather than each trace separately, and trace selection and span retrieval spend ONE budget. Read MID-FLIGHT, at a batch boundary — and the PRODUCER is bounded too, so the refusal no longer costs a whole materialized result: the plan carries a fetch of one row past the row bound, which turns the span query''s blocking sort into a bounded `TopK`. The figure in the message is what was held when the bound was crossed — one row past the row bound, and for the byte bound whatever those rows weigh, since one span can carry megabytes — not the size of the whole result. NOTHING is returned: `/api/v1/sql` answers 413 with a truncated body and says so in its envelope (`truncated`, `max_rows`), but the Jaeger response carries only `data` and `total`, and a trace silently missing spans is worse than no trace. No `Retry-After` — the refusal is deterministic, not load-dependent. Narrow the request: service, operation, time window, tags, or a smaller `limit`. Counted as `siglake_query_breaker_trips_total{breaker="jaeger_name_rows"}` or `{breaker="jaeger_render_bytes"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '429':
          description: 'The shared interactive admission budget stayed full through the admission wait. A trace read reserves from the SAME per-pod budget as `/api/v1/sql` — one reservation per request, held across both query phases — so it sheds the same way. Nothing is wrong with the request: wait `Retry-After` seconds and retry.'
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          description: 'The query memory pool (or the spill directory''s byte cap) refused an allocation for this trace query — the same pool the SQL routes run on, and the same answer they give. Nothing is wrong with the request: wait `Retry-After` seconds and retry.'
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '504':
          description: The request exceeded the server's interactive wall-clock budget. ONE budget starts before tenant resolution and covers the index lookup, table registration and every query phase (for a trace search, trace-id selection AND span retrieval), so a request that spends it all preparing is refused rather than handed a fresh budget to scan with. The refusal releases the admission reservation and cancels any scan already running for the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/jaeger/{index}/api/services/{service}/operations:
    get:
      tags:
      - jaeger
      summary: Jaeger-compatible operation-name list for one service.
      operationId: operations
      parameters:
      - name: index
        in: path
        description: Index holding the spans.
        required: true
        schema:
          type: string
      - name: service
        in: path
        description: Service name to list operations for.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Distinct operation names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JaegerNamesResponse'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: No such index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '413':
          description: 'The render exceeded one of this request''s ceilings. Two units apply: distinct names and accumulated Arrow bytes (a span can carry megabytes of attributes, so no row count bounds the render). Both are DERIVED from the admission reservation this request already holds — `min(16 MiB, budget / share)` — so they move with `SIGLAKE_QUERY_ADMISSION_BUDGET_BYTES` and the pod''s memory and there is no Jaeger-specific knob; the resolved interactive `max_rows_returned` still applies where it is tighter. Counted across the WHOLE request: for a trace search, the spans of every selected trace rather than each trace separately, and trace selection and span retrieval spend ONE budget. Read MID-FLIGHT, at a batch boundary — and the PRODUCER is bounded too, so the refusal no longer costs a whole materialized result: the plan carries a fetch of one row past the row bound, which turns the span query''s blocking sort into a bounded `TopK`. The figure in the message is what was held when the bound was crossed — one row past the row bound, and for the byte bound whatever those rows weigh, since one span can carry megabytes — not the size of the whole result. NOTHING is returned: `/api/v1/sql` answers 413 with a truncated body and says so in its envelope (`truncated`, `max_rows`), but the Jaeger response carries only `data` and `total`, and a trace silently missing spans is worse than no trace. No `Retry-After` — the refusal is deterministic, not load-dependent. Narrow the request: service, operation, time window, tags, or a smaller `limit`. Counted as `siglake_query_breaker_trips_total{breaker="jaeger_name_rows"}` or `{breaker="jaeger_render_bytes"}`.'

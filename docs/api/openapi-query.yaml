          type: string
          example: ready
    RecordsResponse:
      type: object
      description: JSON envelope for `QueryFormat::Records`.
      required:
      - columns
      - row_count
      - rows
      properties:
        approximation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Approximation'
            description: |-
              Present ONLY when the answer is approximate, and then always — with the
              bound and the residual, never a bare flag.

              Absence means exact. That asymmetry is deliberate: a caller that ignores
              this field entirely still gets exact answers treated as exact, and the
              only way to be misled is to receive this field and discard it.
        columns:
          type: array
          items:
            type: string
        cost:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CostReport'
            description: |-
              Cost report attached to every successful response so callers
              can track effort without a separate `/explain` round trip.
        max_rows:
          type:
          - integer
          - 'null'
          description: |-
            Effective row cap that produced the truncation. Only present
            when `truncated == true`.
          minimum: 0
        row_count:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            type: object
          description: One JSON object per row, keyed by `columns`.
        stats:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ScanStats'
            description: |-
              Per-query leaf scan accounting (rows/bytes read, spill). Set by the
              execution path; `Some(ScanStats::default())` on fast-path responses.
        truncated:
          type: boolean
          description: True when the row cap was hit and the result is incomplete.
    RequestLimits:
      type: object
      description: |-
        Per-request limit overrides. Every field optional; missing fields
        fall back to the tier defaults.

        UNKNOWN KEYS ARE REJECTED (HTTP 422), because every field here is a safety
        constraint the caller asked for and silently dropping a misspelt one is the
        worst available outcome. `{"limits":{"max_rows":5000}}` is refused before
        the query is planned, executed or enqueued, rather than answered 200 with
        the tier default (10,000,000 interactive / 100,000 batch) quietly applied.
        A known field over the tier ceiling is still clamped, not refused, and an
        omitted or empty `limits` still means "tier defaults".

        Mind the asymmetry: the REQUEST field is `max_rows_returned`; the response
        envelope reports the cap it applied as `max_rows`. There is deliberately no
        alias for the response spelling — one request name, and a wrong one is
        loud.

        Only this object is strict. The enclosing request body still ignores
        unknown keys.
      properties:
        circuit_breakers:
          type:
          - boolean
          - 'null'
          description: |-
            `false` bypasses the wall-clock timeout but **does not** lift
            the bytes-scanned or row-returned ceilings. Default `true`.
        max_bytes_scanned:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        max_rows_returned:
          type:
          - integer
          - 'null'
          minimum: 0
        max_rows_scanned:
          type:
          - integer
          - 'null'
          minimum: 0
        timeout_seconds:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      additionalProperties: false
    RetentionPolicy:
      type: object
      description: Retention configuration for one index.
      required:
      - period_secs
      properties:
        period_secs:
          type: integer
          format: int64
          description: Retention horizon in seconds.
          minimum: 0
        schedule:
          type:
          - string
          - 'null'
          description: Optional evaluator schedule string.
      additionalProperties: false
    ScanDetail:
      type: object
      required:
      - files_planned
      - files_read
      - files_pruned_bloom
      - planned_bytes
      - planned_rows
      - row_groups_considered
      - row_groups_pruned_bloom
      - row_groups_pruned_stats
      - row_groups_read
      - rows_pruned_selection
      - object_store_reads
      - fetched_bytes
      - decoded_bytes
      properties:
        bytes_data:
          type: integer
          format: int64
          minimum: 0
        bytes_footer:
          type: integer
          format: int64
          minimum: 0
        bytes_index:
          type: integer
          format: int64
          minimum: 0
        bytes_other:
          type: integer
          format: int64
          minimum: 0
        decoded_bytes:
          type: integer
          format: int64
          minimum: 0
        fetched_bytes:
          type: integer
          format: int64
          minimum: 0
        file_attribution:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FileAttribution'
            description: |-
              Bounded file-task membership for geometry joins. Keys are relative to
              the Iceberg table location; omissions are explicit and make
              `identity_complete` false.
        file_cache_bypasses:
          type: integer
          format: int64
          description: |-
            File tasks that consulted the decoded file-batch cache, found nothing,
            and declined to populate it because they carry a converted predicate or
            a raw/promoted prune spec (#4891): they read with their filtering
            intact, exactly as a cache-disabled install does. Counted apart from
            `file_cache_misses` so a response with no population can say whether
            nothing was decoded or every task was ineligible.
          minimum: 0
        file_cache_hits:
          type: integer
          format: int64
          description: |-
            File tasks served from the decoded file-batch cache. A hit returns
            cached Arrow batches without building a reader, so it counts in none of
            `files_read`, `row_groups_read`, `object_store_reads` or the byte
            fields: a response with leaf rows, `files_read: 0` and this non-zero
            was served from memory, not measured before its reads landed. Omitted
            when zero (cache disabled, or every task bypassed it).
          minimum: 0
        file_cache_misses:
          type: integer
          format: int64
          description: |-
            File tasks that consulted the decoded file-batch cache, found nothing,
            and read the file (populating the cache on the way). Tasks carrying a
            raw or promoted prune spec bypass the cache and count in neither field.
          minimum: 0
        file_cache_populate_rows:
          type: integer
          format: int64
          description: |-
            Rows this request's populations were handed before they stopped (#4890)
            — decode depth offered to the cache, summed over the tasks that
            populated. Counted before the residual filter above the scan drops any
            of them, and it keeps rising after a candidate goes oversized, so it
            measures how far the read got rather than what was kept. A clipped
            browse populates nothing today, and this is how deep it got anyway.
          minimum: 0
        files_planned:
          type: integer
          format: int64
          minimum: 0
        files_pruned_bloom:
          type: integer
          format: int64
          minimum: 0
        files_read:
          type: integer
          format: int64
          minimum: 0
        object_store_reads:
          type: integer
          format: int64
          minimum: 0
        ordering:
          type:
          - string
          - 'null'
          description: |-
            Scan-ordering gate decision: `"advertised"` (the scan streams sorted,
            ordered LIMITs early-stop) or the refusal reason (`"filtered"`,
            `"fan_in"`, `"no_bounds"`, …). Absent on responses from servers that
            predate the field.
        planned_bytes:
          type: integer
          format: int64
          minimum: 0
        planned_rows:
          type: integer
          format: int64
          minimum: 0
        row_groups_considered:
          type: integer
          format: int64
          minimum: 0
        row_groups_pruned_bloom:
          type: integer
          format: int64
          minimum: 0
        row_groups_pruned_stats:
          type: integer
          format: int64
          minimum: 0
        row_groups_read:
          type: integer
          format: int64
          minimum: 0
        rows_pruned_selection:
          type: integer
          format: int64
          minimum: 0
        unsettled_partitions:
          type: integer
          format: int64
          description: |-
            Scan partitions still unwinding when this block was built. Their
            counters fold only when they finish, so a non-zero value means every
            count above is missing that many partitions' worth of reads. The
            server waits for an early-stopped scan's partitions to finish before
            rendering, so this is omitted (zero) in the normal case and appears
            only when that wait hit its deadline.
          minimum: 0
    ScanStats:
      type: object
      description: |-
        Per-query scan accounting surfaced on the response for benchmarking and
        observability. `rows_scanned`/`bytes_scanned` are the leaf rows + bytes the
        query actually read from data files; an **all-zero** `ScanStats` on a
        successful aggregate is the signal that a pre-aggregate fast path served the
        query with *no* data-file scan (the pruning win). `spill_bytes` is
        aggregation/sort spill.
      required:
      - rows_scanned
      - bytes_scanned
      - spill_bytes
      properties:
        bytes_scanned:
          type: integer
          format: int64
          minimum: 0
        phases:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PhaseStats'
            description: |-
              #85: per-phase wall breakdown for shape-level attribution (which stage
              a slow query spent its time in). `None` on paths that don't measure
              (fast paths — they're the ~ms answers). Boxed to keep the response
              enum variants small.
        rows_scanned:
          type: integer
          format: int64
          minimum: 0
        scan:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ScanDetail'
            description: |-
              Per-request scan attribution: what the plan assigned, what each pruning
              mechanism dropped, what the read actually cost. `None` when the plan
              executed no siglake data-file scan (Tier-1/metadata answers).
        served_by:
          type:
          - string
          - 'null'
          description: |-
            WHICH path produced the answer.

            `rows_scanned` alone cannot tell you: it counts DataFusion scan output,
            and the footer-sum and raw-page paths bypass it entirely, so a
            multi-second answer and a sub-millisecond one both report 0. That
            ambiguity hid the original `top_hosts` regression and then hid a 6.5s
            `GROUP BY host` on the 2026-08-03 1TB round — twice costing an
            investigation that started from the wrong premise.

            `tier1_*` are the warm-metadata answers, including
            `tier1_windowed_agg` (the per-snapshot 2D time x group rollup: warm
            metadata plus at most two boundary ranges). `materialized` means footers
            were summed per live file or raw pages decoded — correct, but priced in
            seconds at scale. `sketch` is the bounded approximate summary.

            `tier1_windowed_agg` and `materialized` used to be one label, so a
            windowed GROUP BY could fall back from the rollup to a footer read per
            file — orders of magnitude — and report the same string either way.
            `siglake_query_windowed_agg_fallback_total` names the reason when it
            happens.
        spill_bytes:
          type: integer
          format: int64
          minimum: 0
    ShardParam:
      type: object
      description: A `{index, count}` scan-shard selector on a query request.
      required:
      - index
      - count
      properties:
        count:
          type: integer
          minimum: 0
        index:
          type: integer
          minimum: 0
    ShardPin:
      type: object
      description: '#89/#1655: one table generation a shard read is pinned to.'
      required:
      - table
      properties:
        empty:
          type: boolean
          description: |-
            Pin the table's initial, snapshotless generation. This differs from
            omitting `pin`, which deliberately asks for the worker's current
            generation.
        schema_id:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            #2554: the Iceberg schema id the coordinator PLANNED against, from the
            same metadata generation as `snapshot_id`.

            A snapshot is not the whole identity of what a query is served from. An
            additive `migrate-schema` commits an `UpdateSchemaAction` and no data
            snapshot, so the schema id moves while the snapshot id stands still. A
            worker whose metadata cache predates that migration therefore RECOGNISES
            the pinned snapshot and answers from its narrow schema, and a fragment
            referencing the new column fails on that peer as invalid SQL while every
            other peer succeeds.

            A worker enforces this alongside the snapshot: it refreshes its metadata
            once, serves the pinned schema — including a historical one, so a worker
            AHEAD of the coordinator is not refused — and answers **503**
            (`reason: "shard_pin_unresolved"`) when the generation cannot be
            honoured at all.

            Omitted means the pre-#2554 contract: the snapshot alone is enforced and
            the worker plans against its own current schema. That is what an older
            COORDINATOR sends. In the other direction — a coordinator that sends it
            to an older WORKER — the field is ignored, so a mixed-version cluster
            keeps the old exposure until every replica is upgraded.
        snapshot_id:
          type:
          - integer
          - 'null'
          format: int64
          description: The exact committed snapshot to read. Mutually exclusive with `empty`.
        table:
          type: string
        table_uuid:
          type:
          - string
          - 'null'
          description: |-
            #2921: the Iceberg table incarnation the coordinator captured.
            Snapshot and schema identifiers can both repeat when a snapshotless
            managed index is dropped and recreated under the same name.

            A worker enforces this against the same cached table handle it uses to
            resolve the schema or snapshot. A mismatch refreshes once, then refuses
            the shard if the named incarnation is no longer available.

            Omitted means the pre-#2921 contract: snapshot and schema pins are
            enforced as supplied, without incarnation identity. This permits an
            older coordinator to address a newer worker. An older worker ignores a
            UUID sent by a newer coordinator, retaining the old exposure until all
            workers have been upgraded.
    ShardQueryRequest:
      type: object
      required:
      - query
      properties:
        pin:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ShardPin'
            description: |-
              #89/#1655: the exact table generation used to construct the
              coordinator's WAL partial — a snapshot by id (or the initial empty
              generation) and, since #2554, the schema id it planned against. The
              worker reads THAT generation so a fan-out is consistent cluster-wide: a
              worker whose cache runs ahead would otherwise double-serve rows the
              coordinator still counts in its buffer partial, or answer with a wider
              column set than the merge was planned for.

              A worker that cannot resolve the pinned generation (a snapshot expired,
              a schema unknown, or either still not visible after one metadata
              refresh) answers **503** rather than serving its own current one: file
              shards only partition the table when every worker enumerates the same
              file generation, and a two-phase merge only type-checks when every
              partial carries the schema the coordinator planned. Omit `pin` to read
              the worker's current generation deliberately.
        priority:
          $ref: '#/components/schemas/Priority'
          description: |-
            Original query priority, forwarded by the coordinator so the worker
            applies the matching tier's mid-flight breaker. Defaults to interactive
            (the only priority that is ever coordinated).
        query:
          type: string
        shard:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ShardParam'
        tenant:
          type:
          - string
          - 'null'
          description: |-
            The tenant the ORIGINAL caller resolved to, forwarded by the coordinator.

            A shard request carries the coordinator's own credential, not the
            caller's, so without this the worker re-derives tenancy from a token that
            belongs to no tenant and reads the DEFAULT namespace for a tenant
            caller -- a silent cross-tenant read on the packaged 2-replica default.

            Honoured ONLY when the request authenticated with this node's own
            `coordinator_token` -- `CallerIdentity::coordinator`, decided once in the
            auth middleware. Otherwise a user who can reach `/shard` directly could
            name any tenant they liked.
    SqlRequest:
      type: object
      required:
      - query
      properties:
        default_order:
          type: boolean
          description: |-
            Order a bare interactive `SELECT` newest-first (default true).

            A query that names ONE timestamp-bearing table and asks for no ordering
            of its own is given `ORDER BY timestamp DESC` — what a log reader means
            by `SELECT timestamp, raw FROM t LIMIT 100`, and what puts the query on
            the ordered early-stop path instead of a file-order scan. Eligible
            tables are `events`, `query_audit`, and any managed index whose doc
            mapping declares `timestamp` as its `timestamp_field`; an index that
            names another event-time field is left as written, because a column
            called `timestamp` there need not be a time order.

            An explicit `ORDER BY`, a `GROUP BY`, an aggregate, a CTE, a join,
            `DISTINCT`, `EXPLAIN` and the batch tier are never rewritten. Neither
            is a projection that gives another column the output name `timestamp`
            (`SELECT raw AS timestamp FROM t LIMIT 2`): SQL resolves the injected
            bare identifier to that output name, and the source column cannot be
            named around the alias. Identifier case follows SQL's rules here: a
            mapping may declare both `timestamp` and `Timestamp`, and the quoted
            `"Timestamp"` is the second of them, so `SELECT "Timestamp" AS
            timestamp FROM t LIMIT 2` is a shadowing projection too. An explicit
            `LIMIT` is preserved; without one the rewrite adds
            `max_rows_returned + 1`, so the truncation signal still fires.

            Set false to get the query exactly as written.
        dry_run:
          type: boolean
        exact:
          type: boolean
          description: |-
            Refuse an approximate answer and take the exact path however slow it is.

            Default false, i.e. approximation is ALLOWED. That is the deliberate
            choice: a high-cardinality `GROUP BY` that silently costs seconds is a
            worse surprise than a labelled approximation, and the response always
            says which it gave you. Set this when a caller would rather wait —
            billing, reconciliation, anything where the number is the deliverable.
        format:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QueryFormat'
        limits:
          $ref: '#/components/schemas/RequestLimits'
        priority:
          $ref: '#/components/schemas/Priority'
        query:
          type: string
        shard:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ShardParam'
            description: |-
              Distributed-query shard (#7): when set, this worker scans only its
              `index`-of-`count` slice of the table's files. A coordinator fans the
              query out to `count` workers (shards `0..count`) and merges the partial
              results. Absent ⇒ a normal whole-table scan.
    SqlSuccess:
      oneOf:
      - $ref: '#/components/schemas/RecordsResponse'
        description: Result rows. The normal case.
      - $ref: '#/components/schemas/CostReport'
        description: 'Cost estimate only, returned when the request set `dry_run: true`.'
      description: |-
        The two success bodies `POST /api/v1/sql` can return at `200`: a dry run
        answers with only a cost report, while a real query answers with result rows.
  securitySchemes:
    query_token:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <token>`. With OIDC configured the token is a JWT and its claims select the tenant; otherwise it is matched against the cluster''s static token list. A server started with neither accepts unauthenticated requests.'
security:
- query_token: []
tags:
- name: health
  description: Liveness and readiness probes. Unauthenticated.
- name: sql
  description: Query execution and cost estimation.
- name: indexes
  description: Index configuration CRUD.
- name: index-templates
  description: Mappings applied to indexes created later, matched by glob.
- name: jobs
  description: Batch-query job lifecycle.
- name: delete-tasks
  description: Asynchronous targeted row deletion (GDPR).
- name: debug
  description: Authenticated process diagnostics.
- name: jaeger
  description: Jaeger-compatible trace read API, so the Jaeger UI can point here unchanged.

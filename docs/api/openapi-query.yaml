  /api/v1/sql:
    post:
      tags:
      - sql
      summary: |-
        `POST /api/v1/sql` entry point. Transparently coordinates a distributed
        query when worker peers are configured and this is an ordinary interactive
        request; otherwise (no peers, a worker sub-request with `shard`, a batch
        job, or a dry-run) it runs the single-pod path, which is also always
        reachable at `POST /api/v1/sql/local`.
      operationId: handle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRequest'
        required: true
      responses:
        '200':
          description: 'Success. Normally result rows (`RecordsResponse`); a `dry_run` request returns only the `CostReport` instead. When the request asks for `format: "ndjson"` the body is `application/x-ndjson` — one JSON object per line, streamed, with a trailing `{"_meta": ...}` line if the result was cut short or execution failed after the 200 response started. An error trailer carries `code` and `error`; a pool-refusal trailer also carries `retry_after_secs`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlSuccess'
            application/x-ndjson:
              schema:
                type: string
        '202':
          description: 'Admitted and queued on the dedicated runtime when the request set `priority: "batch"`. Poll the returned URLs. Batch submissions share the query admission budget and return 429 instead when it remains full through the admission wait.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '400':
          description: Empty or unparseable SQL, a statement that is not a read (DDL, DML and session statements — `CREATE`, `COPY … TO`, `INSERT`, `SET` — are refused before they can take effect), or a rejected cost estimate. `cost` carries the estimate that was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '413':
          description: 'Two distinct cases. Either the row cap was hit while rendering — the body is then a `RecordsResponse` with `truncated: true` and the rows that did fit — or the mid-flight rows-scanned breaker tripped, in which case the body is an error carrying `cost` and `stats`. Distinguish by whether `rows` is present.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: 'Unprocessable request body: a key inside `limits` is not a known per-request limit. The commonest case is `max_rows`, which is the RESPONSE envelope''s name for the applied cap; the request field is `max_rows_returned`. Refused by the JSON extractor before planning, execution or batch enqueue, so no work is done and no job is created — a dropped cap is never applied silently. The body is the extractor''s plain-text message naming the unknown field, not an `ApiErrorBody`. Unknown keys at the TOP level of the request are still ignored.'
        '429':
          description: Admission control rejected the interactive query or batch submission; the server is at its in-flight ceiling.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          description: 'Retryable refusal, from this server or from a worker whose answer is forwarded: the query memory pool (or the spill directory''s byte cap) refused an allocation, or a fanned-out shard could not resolve the generation — table incarnation, snapshot or schema — the coordinator pinned it to (`reason: "shard_pin_unresolved"`), which is refused rather than answered from a mix of generations. Nothing is wrong with the query: wait `Retry-After` seconds and retry.'
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '504':
          description: The query exceeded its wall-clock budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/sql/distributed:
    post:
      tags:
      - sql
      summary: |-
        Coordinator endpoint: fan `req.query` across the configured worker peers and
        merge into the single-pod answer. 400 when no peers are configured. Renders
        `records` (default) or `ndjson`.
      operationId: distributed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRequest'
        required: true
      responses:
        '200':
          description: 'Merged result rows, or NDJSON when the request asked for `format: "ndjson"`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsResponse'
            application/x-ndjson:
              schema:
                type: string
        '400':
          description: Empty or unparseable SQL, a statement that is not a read (DDL, DML and session statements — `CREATE`, `COPY … TO`, `INSERT`, `SET` — are refused before they can take effect), or no worker peers are configured on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '413':
          description: Row cap hit, or the mid-flight rows-scanned breaker tripped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: 'Unprocessable request body: a key inside `limits` is not a known per-request limit. The commonest case is `max_rows`, which is the RESPONSE envelope''s name for the applied cap; the request field is `max_rows_returned`. Refused by the JSON extractor before planning, execution or batch enqueue, so no work is done and no job is created — a dropped cap is never applied silently. The body is the extractor''s plain-text message naming the unknown field, not an `ApiErrorBody`. Unknown keys at the TOP level of the request are still ignored.'
        '429':
          description: Admission control rejected the query.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error, including a failed shard with no surviving replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          description: 'Retryable refusal, from this coordinator or from a worker whose answer is forwarded: the query memory pool refused an allocation, or a shard could not resolve the generation — table incarnation, snapshot or schema — this coordinator pinned the fan-out to (`reason: "shard_pin_unresolved"`). A pinned shard is never answered from a different generation, so the whole query is refused rather than merged across them. Wait `Retry-After` seconds and retry.'
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '504':
          description: The query exceeded its wall-clock budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/sql/explain:
    post:
      tags:
      - sql
      summary: Estimate a query's cost without running it.
      description: |-
        Returns the same `CostReport` that a successful query attaches to its
        response, so a client can gate on effort before committing to the read.
      operationId: explain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRequest'
        required: true
      responses:
        '200':
          description: Cost estimate. `exact` is false when the estimate fell back to a heuristic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReport'
        '400':
          description: Empty or unparseable SQL, or a statement that is not a read (DDL, DML and session statements — `CREATE`, `COPY … TO`, `INSERT`, `SET` — are refused before they can take effect).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: 'Unprocessable request body: a key inside `limits` is not a known per-request limit. The commonest case is `max_rows`, which is the RESPONSE envelope''s name for the applied cap; the request field is `max_rows_returned`. Refused by the JSON extractor before planning, execution or batch enqueue, so no work is done and no job is created — a dropped cap is never applied silently. The body is the extractor''s plain-text message naming the unknown field, not an `ApiErrorBody`. Unknown keys at the TOP level of the request are still ignored.'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/sql/local:
    post:
      tags:
      - sql
      summary: Run a SQL query on this pod only.
      description: |-
        Identical to `POST /api/v1/sql` except that it never fans out to worker
        peers, whatever the deployment. Useful for isolating a coordinator from its
        workers when debugging.
      operationId: handle_local
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRequest'
        required: true
      responses:
        '200':
          description: 'Success. Result rows, the `CostReport` for a `dry_run`, or an `application/x-ndjson` stream for `format: "ndjson"`. If execution fails after that stream''s 200 response starts, its final line is an `_meta: "error"` trailer with `code` and `error`; a pool refusal also carries `retry_after_secs`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlSuccess'
            application/x-ndjson:
              schema:
                type: string
        '202':
          description: 'Admitted and queued on the dedicated runtime when `priority: "batch"`; returns 429 instead if the shared admission budget remains full through the admission wait.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '400':
          description: Empty or unparseable SQL, a statement that is not a read (DDL, DML and session statements — `CREATE`, `COPY … TO`, `INSERT`, `SET` — are refused before they can take effect), or a rejected cost estimate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '413':
          description: Row cap hit (body is a truncated `RecordsResponse`) or the mid-flight breaker tripped (body is an error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: 'Unprocessable request body: a key inside `limits` is not a known per-request limit. The commonest case is `max_rows`, which is the RESPONSE envelope''s name for the applied cap; the request field is `max_rows_returned`. Refused by the JSON extractor before planning, execution or batch enqueue, so no work is done and no job is created — a dropped cap is never applied silently. The body is the extractor''s plain-text message naming the unknown field, not an `ApiErrorBody`. Unknown keys at the TOP level of the request are still ignored.'
        '429':
          description: Admission control rejected the interactive query or batch submission.
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          description: 'The query memory pool (or the spill directory''s byte cap) refused an allocation. Nothing is wrong with the query: wait `Retry-After` seconds and retry.'
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '504':
          description: The query exceeded its wall-clock budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /api/v1/sql/shard:
    post:
      tags:
      - sql
      summary: |-
        Worker endpoint: run the (sharded) query locally and return the result as an
        Arrow IPC stream (lossless transport). Not intended for human clients.
      operationId: shard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShardQueryRequest'
        required: true
      responses:
        '200':
          description: Partial result for this shard, as an Arrow IPC **stream** (lossless — the coordinator merges typed batches, not JSON).
          content:
            application/vnd.apache.arrow.stream:
              schema:
                type: array
                items:
                  type: integer
                  format: int32
                  minimum: 0
        '400':
          description: Empty or unparseable SQL, an invalid generation pin, a statement that is not a read (DDL, DML and session statements — `CREATE`, `COPY … TO`, `INSERT`, `SET` — are refused before they can take effect), or an invalid shard selector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '413':
          description: The mid-flight rows-scanned breaker tripped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          description: 'Retryable refusal. Either this worker''s query memory pool (or spill directory byte cap) refused an allocation, or the request carried a `pin` whose generation this worker cannot resolve even after a metadata refresh (`reason: "shard_pin_unresolved"` in the body, with the pin) — a pinned shard is never answered from a different table incarnation or snapshot, because file shards only partition the table when every worker reads the same file generation, nor from a different schema, because a fan-out plans once on the coordinator. The coordinator forwards either to the caller rather than re-running the shard on itself.'
          headers:
            retry-after:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '504':
          description: The shard exceeded its wall-clock budget. The budget starts when the request arrives and covers preparation (tenant resolution, table registration, pin resolution, planning) as well as execution, so a shard that spends it all preparing is refused without starting its scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /debug/memory-pool:
    get:
      tags:
      - debug
      summary: Snapshot the process-wide DataFusion memory pool.
      description: |-
        `top_consumers` is DataFusion's own report text, ordered by current
        reservation. The byte fields are `null` for an unbounded pool, and the
        report is `null` when consumer tracking is disabled or the pool is
        unbounded.
      operationId: memory_pool
      responses:
        '200':
          description: Current query memory-pool occupancy and its ten largest tracked consumers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryPoolDebugResponse'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '403':
          description: Tenant refused before the handler runs. This server derives the tenant from a verified JWT claim when one is configured (`--oidc-tenant-claim`), and this token carries none, or carries one that is not a usable tenant id (`[A-Za-z0-9_-]`, 1..=128 chars), or is absent from the configured `--allowed-tenants` set. Answered by the auth middleware, so it can reach every operation behind it — including this one, which reads no tenant data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
  /healthz:
    get:
      tags:
      - health
      summary: Liveness probe.
      description: |-
        Mounted outside the auth layer, so it needs no credentials. Answers `200` as
        long as the process is serving; it says nothing about catalog reachability —
        use `/readyz` for that.
      operationId: healthz
      responses:
        '200':
          description: The process is serving.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security:
      - {}
  /readyz:
    get:
      tags:
      - health
      summary: 'Readiness probe: verifies the Iceberg catalog is reachable.'
      description: Mounted outside the auth layer, so it needs no credentials.
      operationId: readyz
      responses:
        '200':
          description: Catalog reachable; ready to serve queries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Catalog unreachable. `error` carries the cause.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
      security:
      - {}
components:
  schemas:
    ApiErrorBody:
      type: object
      description: |-
        Error body used by every endpoint on this server.

        Spec-only. Some errors additionally flatten diagnostic keys into the top
        level — `cost` on a rejected or timed-out query, and `cost` plus `stats` on
        the mid-flight rows breaker — so this schema deliberately allows additional
        properties rather than pinning an exact shape.
      required:
      - error
      - code
      properties:
        code:
          type: integer
          format: int32
          description: Echo of the HTTP status code.
          minimum: 0
        cost:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CostReport'
            description: Present when the failure was cost- or time-related.
        error:
          type: string
          description: Human-readable failure description.
    Approximation:
      type: object
      description: What makes an approximate answer usable rather than merely fast.
      required:
      - reason
      - error_upper_bound
      - not_counted
      - counters
      properties:
        counters:
          type: integer
          description: Distinct values the summary retained.
          minimum: 0
        error_upper_bound:
          type: integer
          format: int64
          description: Every count UNDERSTATES the truth by at most this much.
          minimum: 0
        not_counted:
          type: integer
          format: int64
          description: |-
            Rows no reported group accounts for — the analogue of Elasticsearch's
            and Quickwit's `sum_other_doc_count`. Quickwit's `top_hosts` on the
            http_logs corpus reported 238,291,469 here, i.e. 96.4% of the corpus
            discarded, which is only visible to a caller that looks.
          minimum: 0
        reason:
          type: string
          description: Why the exact answer was not served.
    BatchSubmitResponse:
      type: object
      description: |-
        `202 Accepted` body returned by `POST /api/v1/sql` when the request carries
        `priority: "batch"`: after admission, the query is queued rather than
        executed inline and the caller polls the returned URLs. A full shared query
        admission budget returns `429` instead of creating a job.
      required:
      - job_id
      - status_url
      - result_url
      - priority
      properties:
        job_id:
          type: string
          description: Job identifier (UUIDv7, so ids sort by submission time).
        priority:
          type: string
          description: Always `batch`.
          example: batch
        result_url:
          type: string
          description: |-
            Path to fetch the result once the job succeeds —
            `GET /api/v1/jobs/{id}/result`.
        status_url:
          type: string
          description: Path to poll for status — `GET /api/v1/jobs/{id}`.
    ComplexityClass:
      type: string
      enum:
      - small
      - medium
      - large
      - huge
    CostReport:
      type: object
      description: |-
        Cost report returned by `/explain` and attached to every successful
        query response.
      required:
      - estimated_bytes_scanned
      - estimated_rows_processed
      - estimated_runtime_seconds
      - complexity_class
      - warnings
      - exact
      properties:
        complexity_class:
          $ref: '#/components/schemas/ComplexityClass'
        estimated_bytes_scanned:
          type: integer
          format: int64
          minimum: 0
        estimated_rows_processed:
          type: integer
          format: int64
          minimum: 0
        estimated_runtime_seconds:
          type: number
          format: double
        exact:
          type: boolean
          description: |-
            `true` when the underlying statistics are exact; `false` when
            they fell back to a heuristic.
        files_considered:
          type:
          - integer
          - 'null'
          description: |-
            Live files considered BEFORE the manifest time-bounds prune —
            `files_considered - files_to_scan` is planning-time pruning's win.
          minimum: 0
        files_to_scan:
          type:
          - integer
          - 'null'
          minimum: 0
        warnings:
          type: array
          items:
            type: string
    CreateDeleteTaskRequest:
      type: object
      required:
      - index_id
      - predicate_sql
      properties:
        end_ts:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional exclusive upper time bound.
        index_id:
          type: string
          description: Index whose rows should be deleted.
        predicate_sql:
          type: string
          description: |-
            SQL boolean expression selecting the rows to delete, as it would appear
            after `WHERE`.
          example: host = 'web-01'
        start_ts:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Optional inclusive lower time bound, narrowing the files the executor
            has to rewrite.
    DeleteTask:
      type: object
      description: |-
        A GDPR/delete-task: the deletion request, its lifecycle state, and — once
        terminal — how much it rewrote. Immutable apart from state transitions and
        that terminal accounting.
      required:
      - task_id
      - index_id
      - predicate_sql
      - created_at
      - state
      - files_rewritten
      - rows_deleted
      properties:
        created_at:
          type: string
          format: date-time
        end_ts:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - string
          - 'null'
        files_rewritten:
          type: integer
          minimum: 0
        index_id:
          type: string
        predicate_sql:
          type: string
        rows_deleted:
          type: integer
          format: int64
          minimum: 0
        start_ts:
          type:
          - string
          - 'null'
          format: date-time
        state:
          $ref: '#/components/schemas/DeleteTaskState'
        table_uuid:
          type:
          - string
          - 'null'
          description: |-
            The Iceberg table this deletion was accepted against — the index
            incarnation it is authorised for. An index id can be deleted and
            created again, and the executor refuses a task whose index id now
            resolves to a different table, so the request recovers by resubmission
            instead of deleting rows nobody reviewed.

            Null on tasks recorded by builds before this binding existed. Those are
            readable, and refused at execution for the same reason.
        task_id:
          type: string
          format: uuid
    DeleteTaskClaimObservation:
      type: object
      description: |-
        Read-only observation of a pending delete task's permanent claim object.

        `present` says only that the object was observed during this read. It does
        not establish claimant liveness, abandonment, execution, commit outcome,
        or whether takeover would be safe. When a present claim body is malformed
        or names another task, its diagnostic fields are null rather than treating
        the claim as absent.
      required:
      - present
      - observed_at
      properties:
        age_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Whole seconds from claim creation to `observed_at`, floored at zero for
            clock skew. This is not execution duration or proof of abandonment.
          minimum: 0
        claimant:
          type:
          - string
          - 'null'
          format: uuid
        claimed_at:
          type:
          - string
          - 'null'
          format: date-time
        observed_at:
          type: string
          format: date-time
        present:
          type: boolean
    DeleteTaskGetResponse:
      allOf:
      - $ref: '#/components/schemas/DeleteTask'
      - type: object
        properties:
          claim:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DeleteTaskClaimObservation'
              description: Present only while the persisted task state is `pending`.
      description: |-
        GET-only representation of a delete task. POST and collection-list
        responses remain the persisted [`DeleteTask`] contract.
    DeleteTaskState:
      type: string
      description: |-
        Delete-task lifecycle state. The ledger is immutable apart from state
        transitions and terminal stats/error population.
      enum:
      - pending
      - running
      - done
      - failed
    DistPhaseStats:
      type: object
      description: Coordinator-side attribution for a distributed query.
      required:
      - mode
      - shard_wall_micros
      - merge_micros
      properties:
        merge_micros:
          type: integer
          format: int64
          description: Coordinator-side merge (re-aggregate / merge-sort / concat + limit).
          minimum: 0
        mode:
          type: string
          description: |-
            Which merge the classifier chose (scan / ordered_scan / aggregate /
            ordered_aggregate / local fallback).
        peer_generation:
          type: integer
          format: int64
          description: |-
            #967: which published membership `peers` was captured from. Membership
            can move between queries, so a shard count is only interpretable
            alongside the generation it was captured at; two answers with different
            generations were partitioned differently and legitimately so.
          minimum: 0
        peers:
          type: integer
          description: |-
            #967: how many peers this query addressed — the shard count `N` of the
            membership snapshot it pinned at dispatch. Every shard `0..N` was
            requested exactly once, on this membership, whether or not the cluster
            has since grown or shrunk.
          minimum: 0
        shard_wall_micros:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: |-
            Per-shard end-to-end wall (request → decoded partials), one entry per
            shard in shard order. The fan-out is concurrent, so the query's
            fan-out wall is the MAX, not the sum — a straggler is visible here.
    DocMapping:
      type: object
      description: Document mapping for one index.
      required:
      - field_mappings
      - timestamp_field
      properties:
        default_search_fields:
          type: array
          items:
            type: string
          description: Fields searched by default for bare text queries.
        field_mappings:
          type: array
          items:
            $ref: '#/components/schemas/FieldMappingSchema'
          description: Declared typed fields in stable order.
        mode:
          $ref: '#/components/schemas/MappingMode'
          description: Handling mode for unmapped attributes.
        tag_fields:
          type: array
          items:
            type: string
          description: Fields treated as low-cardinality tags for pruning.
        timestamp_field:
          type: string
          description: Required event-time field.
      additionalProperties: false
    FieldMappingSchema:
      oneOf:
      - type: object
        description: Full-text/string field. The only variant that accepts `tokenizer`.
        required:
        - name
        - type
        properties:
          name:
            type: string
            description: Column name.
          required:
            type: boolean
            description: Whether the column is required on ingest.
          tokenizer:
            type:
            - string
            - 'null'
            description: |-
              Named tokenizer/analyzer to use for this field. Serialized even when
              absent (as `null`) to match the index mapping wire format.
          type:
            type: string
            enum:
            - text
      - type: object
        description: Signed 64-bit integer.
        required:
        - name
        - type
        properties:
          name:
            type: string
          required:

# cargo-deny configuration — license and advisory gate (runs in CI).

[graph]
all-features = false

[licenses]
# Everything in the tree must resolve to one of these. Copyleft (GPL/AGPL/
# LGPL/SSPL) is deliberately absent.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    # BOOST Software License (permissive, OSI-approved) — NOT the Business
    # Source License, despite the SPDX id.
    "BSL-1.0",
]
confidence-threshold = 0.8

[advisories]
# A yank is the author saying a version is unfit; keep this policy at deny.
# If no replacement exists, add { crate = "name@version", reason = "..." } to ignore below.
yanked = "deny"
ignore = [
    # paste 1.0.15: unmaintained, no patched release. Reached through DataFusion
    # 53.1.0 and parquet 58.4.0, utoipa-axum 0.2.0 and tikv-jemalloc-ctl 0.7.0.
    "RUSTSEC-2024-0436",
    # quick-xml 0.39.4: fixed in 0.41.0, pinned here by object_store 0.13.2 and
    # OpenDAL 0.57 (opendal-core, opendal-service-s3). reqsign is already on
    # quick-xml 0.41.0 and no longer holds these back.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustls-pemfile 2.2.0: unmaintained, no patched release. Sole parent is
    # axum-server 0.7.3; object_store 0.13.2 no longer pulls it in.
    "RUSTSEC-2025-0134",
    # zstd 0.13.3: the affected stream with_context constructors are unused;
    # callers here and in the locked parents use fresh streams or the separate
    # bulk API. Those parents require 0.13, while the fix starts at 0.14.3.
    "RUSTSEC-2026-0391",
    # zstd-safe 7.2.4: the affected Seekable API is compiled only by its
    # optional seekable feature, which is absent from the resolved graph.
    "RUSTSEC-2026-0398",
    # zstd-safe 7.2.4: the affected legacy-frame decoder is compiled only by
    # the legacy feature. All direct zstd dependencies disable default features.
    "RUSTSEC-2026-0403",
    # zstd-sys 2.0.16: the affected allocator shim exists only on wasm32.
    # Siglake's supported binaries and deployment images target native Linux.
    "RUSTSEC-2026-0410",
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "webpki-roots:>=1.0.0,<1.0.10", reason = "RUSTSEC-2026-0381 affects webpki-roots 1.x before 1.0.10" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

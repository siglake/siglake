name: Public release validation
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload duration (long runs require a dedicated self-hosted runner)
        type: choice
        options: [smoke, 24h, 72h]
        default: smoke
      version:
        description: Published version (both runs all supported versions)
        type: choice
        options: [both, v0.1.0, v0.2.0, v0.2.1, v0.3.0, v0.4.0]
        default: both
      candidate_source:
        description: Exact 40-character v0.4.0 candidate source commit (leave all candidate fields empty for released-tag validation)
        type: string
        required: false
      candidate_engine_image:
        description: Public engine image ghcr.io/siglake/siglake:<candidate_source>
        type: string
        required: false
      candidate_operator_image:
        description: Public operator image ghcr.io/siglake/siglake-operator:<candidate_source>
        type: string
        required: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release or candidate selection
        env:
          VALIDATION_VERSION: ${{ inputs.version }}
          VALIDATION_PROFILE: ${{ inputs.profile }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          CANDIDATE_ENGINE_IMAGE: ${{ inputs.candidate_engine_image }}
          CANDIDATE_OPERATOR_IMAGE: ${{ inputs.candidate_operator_image }}
        run: |
          python3 scripts/release-validation/run.py \
            --version "$VALIDATION_VERSION" \
            --profile "$VALIDATION_PROFILE" \
            --candidate-source "$CANDIDATE_SOURCE" \
            --candidate-engine-image "$CANDIDATE_ENGINE_IMAGE" \
            --candidate-operator-image "$CANDIDATE_OPERATOR_IMAGE" \
            --out unused --validate-only
  smoke:
    needs: preflight
    if: inputs.profile == 'smoke' && inputs.candidate_source == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: [v0.1.0, v0.2.0, v0.2.1, v0.3.0, v0.4.0]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate published artifact
        if: inputs.version == 'both' || inputs.version == matrix.version
        run: python3 scripts/release-validation/run.py --version '${{ matrix.version }}' --profile smoke --out '${{ runner.temp }}/release-validation'
      - name: Recover interrupted resources
        if: always()
        run: python3 scripts/release-validation/recover.py '${{ runner.temp }}/release-validation'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-validation
          retention-days: 90
  candidate-smoke:
    needs: preflight
    if: inputs.candidate_source != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact pre-tag candidate
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          CANDIDATE_ENGINE_IMAGE: ${{ inputs.candidate_engine_image }}
          CANDIDATE_OPERATOR_IMAGE: ${{ inputs.candidate_operator_image }}
        run: |
          python3 scripts/release-validation/run.py \
            --version v0.4.0 --profile smoke \
            --candidate-source "$CANDIDATE_SOURCE" \
            --candidate-engine-image "$CANDIDATE_ENGINE_IMAGE" \
            --candidate-operator-image "$CANDIDATE_OPERATOR_IMAGE" \
            --out '${{ runner.temp }}/release-validation-candidate'
      - name: Recover interrupted resources
        if: always()
        run: python3 scripts/release-validation/recover.py '${{ runner.temp }}/release-validation-candidate'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-v0.4.0-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-validation-candidate
          retention-days: 90
  burn-in:
    needs: preflight
    if: inputs.profile != 'smoke' && inputs.candidate_source == ''
    # Dedicated trusted runner; never triggered by untrusted pull requests.
    runs-on: [self-hosted, linux, siglake-validation]
    timeout-minutes: 4500
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: [v0.1.0, v0.2.0, v0.2.1, v0.3.0, v0.4.0]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sustained public-artifact validation
        if: inputs.version == 'both' || inputs.version == matrix.version
        run: python3 scripts/release-validation/run.py --version '${{ matrix.version }}' --profile '${{ inputs.profile }}' --out '${{ runner.temp }}/release-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}'
      - name: Recover interrupted resources
        if: always()
        run: python3 scripts/release-validation/recover.py '${{ runner.temp }}/release-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-${{ matrix.version }}-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version }}
          retention-days: 90

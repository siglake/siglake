name: publish

# Release images to the public registry — TAG-TRIGGERED ONLY (a tag is the
# deliberate release act; CI pushes to the internal registry on every main
# commit separately).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The git tag is `v0.1.0`; the image tag must be what an install asks
      # for, and both charts request their numeric appVersion when image.tag is
      # left empty. Strip one leading v here -- the checkout above still uses
      # the original ref, which is the git ref that exists.
      # scripts/check-release-tags.py evaluates this step against the charts.
      - name: Resolve tag
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=${REF#v}" >> "$GITHUB_ENV"
      - name: Build and push siglake
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/siglake/siglake:${{ env.TAG }}
            ghcr.io/siglake/siglake:latest
          cache-from: type=gha,scope=siglake
          cache-to: type=gha,scope=siglake,mode=max
      - name: Build and push siglake-operator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.operator
          push: true
          tags: |
            ghcr.io/siglake/siglake-operator:${{ env.TAG }}
            ghcr.io/siglake/siglake-operator:latest
          cache-from: type=gha,scope=siglake-operator
          cache-to: type=gha,scope=siglake-operator,mode=max
